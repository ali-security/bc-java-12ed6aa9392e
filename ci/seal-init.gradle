// Seal CI init script, shared by .travis.yml (tests) and .github/workflows/seal-build.yml (jar).
// Turns off the lint gates (checkstyle, error-prone, jacoco reports), keeps test stdout out of
// the log (Travis kills jobs over 4MB of output) and prints each test result plus a per-task summary.
allprojects { p ->
    p.afterEvaluate {
        p.tasks.withType(Checkstyle).configureEach { enabled = false }
        p.tasks.withType(org.gradle.testing.jacoco.tasks.JacocoReport).configureEach { enabled = false }
        p.tasks.withType(JavaCompile).configureEach { t ->
            def ep = t.options.extensions.findByName('errorprone')
            if (ep != null) {
                ep.enabled = false
            }
        }
        p.tasks.withType(Test).configureEach { t ->
            def jc = t.extensions.findByName('jacoco')
            if (jc != null) {
                jc.enabled = false
            }
            t.testLogging {
                showStandardStreams = false
                events 'passed', 'skipped', 'failed'
                exceptionFormat 'full'
            }
            t.afterSuite { desc, result ->
                if (desc.parent == null) {
                    println("TEST SUMMARY ${t.path}: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped)")
                }
            }
        }
    }
}
